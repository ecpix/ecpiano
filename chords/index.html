<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F3F3F1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ecpiano">
  <title>Chord Encyclopedia · ecpiano</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/piano.css">
  <link rel="stylesheet" href="chords.css">
  <script src="../shared/theme-init.js"></script>
</head>
<body data-page="chords" data-title="Chord Encyclopedia">
  <main>
    <p class="subtitle">Pick a note and a chord to see it on the piano.</p>

    <section class="pickers" id="pickers">
      <div class="pickcol">
        <div class="picker" id="rootPicker" data-side="left" aria-label="Root note"></div>
        <button type="button" class="acc-btn" id="accBtn">♯♭</button>
      </div>
      <div class="pickcol">
        <div class="picker" id="qualityPicker" data-side="right" aria-label="Chord type"></div>
      </div>
    </section>

    <section class="result">
      <h2 id="chordTitle" class="sr-only"></h2>
      <p id="chordFull"></p>
      <table id="noteTable"></table>
    </section>

    <div id="pianoWrap">
      <button type="button" class="fav-btn" id="favBtn" aria-pressed="false" aria-label="Save to favorites" title="Save to favorites">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.9-4.7 4.5 1.1 6.4L12 17.4l-5.7 3.1 1.1-6.4L2.7 9.6l6.5-.9z"/></svg>
      </button>
      <div id="piano"></div>
    </div>
    <p class="aliases" id="aliases"></p>

    <div class="play" role="group" aria-label="Play the chord">
      <button type="button" class="pill" id="playBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Play
      </button>
      <button type="button" class="pill" id="arpBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="10" y="9" width="4" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/></svg>Arpeggio
      </button>
    </div>
  </main>

  <script src="../shared/store.js"></script>
  <script src="../shared/user.js"></script>
  <script src="../shared/theory.js"></script>
  <script src="../shared/piano.js"></script>
  <script src="../shared/wheel.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/shell.js"></script>
  <script src="chords.js"></script>
</body>
</html>
